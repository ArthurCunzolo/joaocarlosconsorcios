<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.light{background:var(--off);color:var(--ink)}
.dark{background:radial-gradient(70% 50% at 100% 0%,#330709 0%,rgba(10,10,11,0) 70%),var(--ink);color:#fff}
.top{left:72px;right:72px;top:64px;display:flex;justify-content:space-between;align-items:center}
.logo{width:80px;height:72px}
.dots{left:72px;bottom:64px;display:flex;gap:10px;align-items:center}
.dots i{width:12px;height:12px;border-radius:50%;background:currentColor;opacity:.25}
.dots i.on{width:40px;border-radius:999px;background:var(--red);opacity:1}
.swipe{right:72px;bottom:56px;display:flex;align-items:center;gap:12px;font-weight:800;font-size:24px;letter-spacing:.2em;text-transform:uppercase}
.swipe svg{width:36px;height:36px}
.num{right:64px;top:190px;font-family:var(--display);font-size:540px;line-height:.8;color:transparent;-webkit-text-stroke:4px var(--red);opacity:.9}
.step{left:72px;top:170px;font-weight:800;font-size:26px;letter-spacing:.28em;text-transform:uppercase;color:var(--red)}
.ic{left:72px;top:240px;width:120px;height:120px;border-radius:30px;background:var(--red);display:grid;place-items:center;box-shadow:0 20px 40px -16px rgba(224,30,38,.6)}
.ic svg{width:64px;height:64px}
.t{left:72px;right:72px;top:620px;font-size:132px}
.t .serif{font-size:112px;color:var(--red);display:block;margin-top:6px;line-height:1}
.b{left:72px;width:820px;top:960px;font-size:36px;line-height:1.35;font-weight:500}
.light .b{color:#34343a}.dark .b{color:#d6d6db}
.b b{font-weight:800}.light .b b{color:var(--ink)}.dark .b b{color:#fff}
</style></head><body><style>
.big{left:72px;right:72px;top:190px;font-size:216px;line-height:.86}
.big .serif{font-size:150px;display:block;color:var(--red);margin-top:18px;line-height:.95}
.small{left:72px;top:720px;font-size:40px;font-weight:600;color:#55555c}
.steps{left:72px;right:72px;top:820px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.steps div{background:#fff;border-radius:22px;padding:22px 20px;box-shadow:0 14px 30px -18px rgba(0,0,0,.35);font-weight:800;font-size:24px;line-height:1.15}
.steps div b{display:block;font-family:var(--display);font-weight:400;font-size:56px;color:var(--red);line-height:1;margin-bottom:8px}
.save{left:72px;top:1080px;display:flex;align-items:center;gap:14px;font-size:26px;font-weight:700;color:#55555c}
.save svg{width:34px;height:34px}
.who{left:72px;bottom:120px;display:flex;align-items:center;gap:16px;font-weight:800;font-size:24px}
.who small{display:block;font-weight:500;font-size:18px;opacity:.7}
.av{width:70px;height:70px;border-radius:50%;background:url(fotos/joao-selfie-avatar.jpg) center/cover;box-shadow:0 0 0 3px var(--off),0 0 0 6px var(--red)}
</style>
<div class="canvas light grain"><div class="abs top"><div class="kicker" style="color:var(--red)">Consórcio Ademicon</div><div class="logo logo-ink"></div></div>
<div class="abs big display">Consórcio<span class="serif">em 4 passos.</span></div>
<div class="abs small">Sem complicação, sem letra miúda.</div>
<div class="abs steps"><div><b>01</b>Escolha a carta</div><div><b>02</b>Pague sem juros</div><div><b>03</b>Seja contemplado</div><div><b>04</b>Compre à vista</div></div>
<div class="abs save"><svg viewBox="0 0 24 24" fill="none" stroke="#55555c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4Z"/></svg>Salva pra consultar depois</div>
<div class="abs who"><div class="av"></div><div>João Carlos Cunzolo Jr.<small>Representante Ademicon</small></div></div>
<div class="abs dots"><i class="on"></i><i></i><i></i><i></i><i></i><i></i></div><div class="abs swipe">Arraste <svg viewBox="0 0 24 24" fill="none" stroke="#E01E26" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
</div></body></html>
