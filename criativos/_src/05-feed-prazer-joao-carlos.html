<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.canvas{background:var(--ink);color:#fff}
.bg{inset:0;background:url(fotos/joao-terno.jpg) 37% 0/auto 1350px no-repeat;filter:grayscale(.15) contrast(1.05) brightness(.9)}
.shade{inset:0;background:linear-gradient(180deg,rgba(10,10,11,.55) 0%,rgba(10,10,11,0) 22%,rgba(10,10,11,0) 45%,rgba(10,10,11,.85) 68%,var(--ink) 86%)}
.shade2{inset:0;background:linear-gradient(90deg,rgba(10,10,11,.55),transparent 40%)}
.mast{left:64px;right:64px;top:56px;display:flex;justify-content:space-between;align-items:flex-start}
.mast .t{font-family:var(--display);font-size:40px;letter-spacing:.14em}
.mast .t small{display:block;font-family:var(--sans);font-weight:600;font-size:18px;letter-spacing:.3em;opacity:.7;margin-top:6px}
.logo{width:84px;height:76px}
.rule{left:64px;right:64px;top:150px;height:2px;background:rgba(255,255,255,.35)}
.side{left:64px;top:210px;width:240px;display:flex;flex-direction:column;gap:26px}
.side div{font-weight:800;font-size:24px;line-height:1.15;letter-spacing:-.01em;border-left:4px solid var(--red);padding-left:14px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.side div small{display:block;font-weight:500;font-size:18px;opacity:.8;margin-top:4px}
.h{left:64px;right:64px;top:790px;font-size:176px}
.h .serif{font-size:96px;display:block;margin-bottom:22px;color:#fff}
.h .red{display:block}
.role{left:64px;right:64px;top:1128px;font-size:28px;font-weight:600;color:#d8d8dc;letter-spacing:-.01em}
.role b{color:#fff;font-weight:800}
.bottom{left:64px;right:64px;bottom:56px;display:flex;justify-content:space-between;align-items:center;border-top:2px solid rgba(255,255,255,.2);padding-top:26px}
.bottom .wa{font-weight:800;font-size:30px}
.bottom .wa small{display:block;font-weight:600;font-size:18px;letter-spacing:.24em;text-transform:uppercase;color:var(--red);margin-bottom:6px}
.cta{font-size:28px;padding:20px 32px}
.cta svg{width:32px;height:32px}
</style></head><body>
<div class="canvas grain">
  <div class="abs bg"></div><div class="abs shade"></div><div class="abs shade2"></div>
  <div class="abs mast"><div class="t">CONQUISTA<small>Edição · Seu próximo objetivo</small></div><div class="logo logo-white"></div></div>
  <div class="abs rule"></div>
  <div class="abs side">
    <div>Imóveis<small>Casa, apto, terreno</small></div>
    <div>Veículos<small>Carros, motos, pesados</small></div>
    <div>Negócios<small>Sala, galpão, frota</small></div>
  </div>
  <div class="abs h display"><span class="serif">Prazer,</span><span class="red">João Carlos.</span></div>
  <div class="abs role">Seu consultor de consórcio <b>Ademicon</b> — do planejamento à contemplação.</div>
  <div class="abs bottom">
    <div class="wa"><small>Fale direto comigo</small>(11) 99605-0690</div>
    <div class="cta">Me chama no WhatsApp
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
  </div>
</div></body></html>
