<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="fem.css">
<style>
.canvas{background:var(--blush);color:var(--wine)}
.ph{inset:0;background:url(fotos/mulher-feed.jpg) 100% 30%/auto 1350px no-repeat}
.ov{inset:0;background:linear-gradient(90deg,rgba(248,234,228,.97) 0%,rgba(248,234,228,.92) 36%,rgba(248,234,228,.55) 50%,rgba(248,234,228,0) 62%)}
.ov2{left:0;right:0;bottom:0;height:300px;background:linear-gradient(0deg,rgba(248,234,228,.9),rgba(248,234,228,0))}
.top{left:72px;right:72px;top:64px;display:flex;justify-content:space-between;align-items:center}
.h{left:72px;top:150px;font-family:var(--serif);line-height:.9;color:var(--wine)}
.h .a{font-size:138px;display:block}
.h .b{font-size:150px;font-style:italic;display:block;color:var(--red)}
.list{left:72px;top:600px;display:flex;flex-direction:column;gap:16px}
.list .chip{position:static;font-size:27px;padding:15px 24px;align-self:flex-start}
.lead{left:72px;top:880px;width:470px;font-size:30px;line-height:1.3;font-weight:500;color:#5a2a30}
.lead b{color:var(--wine);font-weight:800}
.bottom{left:72px;bottom:64px}
.fcta{font-size:30px;padding:22px 34px}.fcta svg{width:34px;height:34px}
.who{margin-top:20px;font-weight:800;font-size:23px;color:var(--wine)}
.who small{display:block;font-weight:500;font-size:18px;opacity:.75;margin-top:2px}
.sp1{left:520px;top:200px;width:40px;height:40px;fill:var(--red);opacity:.85}
.sp2{left:470px;top:330px;width:22px;height:22px;fill:var(--gold)}
</style></head><body>
<div class="canvas grain">
  <div class="abs ph"></div><div class="abs ov"></div><div class="abs ov2"></div>
  <div class="abs top"><div class="kicker">Consórcio de serviços</div><div class="logo logo-red" style="width:80px;height:72px"></div></div>
  <div class="abs h"><span class="a">Realize</span><span class="b">o seu<br>sonho.</span></div>
  <svg class="abs sp1" viewBox="0 0 24 24"><path d="M12 0c.8 6.2 5.8 11.2 12 12-6.2.8-11.2 5.8-12 12-.8-6.2-5.8-11.2-12-12C6.2 11.2 11.2 6.2 12 0Z"/></svg><svg class="abs sp2" viewBox="0 0 24 24"><path d="M12 0c.8 6.2 5.8 11.2 12 12-6.2.8-11.2 5.8-12 12-.8-6.2-5.8-11.2-12-12C6.2 11.2 11.2 6.2 12 0Z"/></svg>
  <div class="abs list">
    <div class="chip"><i></i>Prótese de silicone</div>
    <div class="chip"><i></i>Cirurgia plástica</div>
    <div class="chip"><i></i>Procedimentos estéticos</div>
  </div>
  <div class="abs lead">Com a carta de crédito Ademicon, <b>sem juros e no seu tempo</b> — com a clínica e o profissional que você escolher.</div>
  <div class="abs bottom">
    <div class="fcta">Quero saber como
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
    <div class="who">João Carlos Cunzolo Jr.<small>Representante Ademicon · (11) 99605-0690</small></div>
  </div>
</div></body></html>
