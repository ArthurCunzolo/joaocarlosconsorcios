<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="fem.css">
<style>
.canvas{background:linear-gradient(180deg,#F6E6DF 0%,#E9D2C6 40%,#bd9d88 60%);color:var(--wine)}
.ph{left:-192px;bottom:0;width:1346px;height:1670px;background:url(fotos/mulher-story.jpg) center/cover no-repeat}
.ov{left:0;right:0;top:0;height:1180px;background:linear-gradient(180deg,#F6E6DF 0%,#F6E6DF 55%,rgba(246,230,223,.8) 72%,rgba(246,230,223,0) 100%)}
.top{left:80px;right:80px;top:236px;display:flex;justify-content:space-between;align-items:center}
.h{left:80px;width:860px;top:320px;font-family:var(--serif);color:var(--wine);line-height:.95}
.h .a{font-size:100px;display:block}
.h .b{font-size:124px;font-style:italic;display:block;color:var(--red);margin-top:10px}
.chips{left:80px;right:80px;top:790px;display:flex;flex-wrap:wrap;gap:14px}
.chips .chip{position:static;font-size:27px;padding:15px 24px}
.card{left:56px;right:56px;bottom:230px;display:flex;align-items:center;gap:22px;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-radius:28px;padding:24px 28px;box-shadow:0 24px 50px -20px rgba(74,9,20,.4)}
.av{width:96px;height:96px;border-radius:50%;background:url(fotos/joao-avatar.jpg) center/cover;box-shadow:0 0 0 3px #fff,0 0 0 6px var(--wine);flex:none}
.card p{font-size:28px;line-height:1.28;font-weight:500;color:#4a2228}
.card p b{color:var(--wine);font-weight:800}
.perks{left:80px;right:80px;top:1030px;}
.perks span{font-size:24px;padding:10px 20px;background:rgba(255,255,255,.6)}
.sp1{right:120px;top:700px;width:44px;height:44px;fill:var(--red);opacity:.85}
.sp2{right:190px;top:780px;width:22px;height:22px;fill:var(--gold)}
</style></head><body>
<div class="canvas story grain">
  <div class="abs ph"></div><div class="abs ov"></div>
  <div class="abs top"><div class="kicker">Consórcio de serviços</div><div class="logo logo-red" style="width:80px;height:72px"></div></div>
  <div class="abs h"><span class="a">Aquele sonho que você<br>vive adiando</span><span class="b">tem data pra sair<br>do papel.</span></div>
  <svg class="abs sp1" viewBox="0 0 24 24"><path d="M12 0c.8 6.2 5.8 11.2 12 12-6.2.8-11.2 5.8-12 12-.8-6.2-5.8-11.2-12-12C6.2 11.2 11.2 6.2 12 0Z"/></svg><svg class="abs sp2" viewBox="0 0 24 24"><path d="M12 0c.8 6.2 5.8 11.2 12 12-6.2.8-11.2 5.8-12 12-.8-6.2-5.8-11.2-12-12C6.2 11.2 11.2 6.2 12 0Z"/></svg>
  <div class="abs chips"><div class="chip"><i></i>Prótese de silicone</div><div class="chip"><i></i>Cirurgia plástica</div><div class="chip"><i></i>Procedimentos estéticos</div></div>
  <div class="abs card"><div class="av"></div><p>Me manda <b>"SONHO"</b> no direct que eu te mostro como usar a carta de crédito Ademicon — <b>sem juros, no seu tempo.</b></p></div>
</div></body></html>
