<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.canvas{background:radial-gradient(90% 55% at 50% 0%,#3a080b 0%,rgba(10,10,11,0) 70%),radial-gradient(80% 40% at 100% 100%,#2a0507 0%,rgba(10,10,11,0) 70%),var(--ink);color:#fff}
.top{left:80px;right:80px;top:240px;display:flex;justify-content:space-between;align-items:center}
.logo{width:84px;height:76px}
.h{left:80px;right:80px;top:340px;font-size:170px;line-height:1}
.h .serif{font-size:176px;color:var(--red);display:block;margin-top:-4px}
.grid{left:80px;right:80px;top:880px;display:grid;grid-template-columns:1fr 1fr;gap:28px}
.opt{position:relative;height:290px;border-radius:28px;padding:34px;background:linear-gradient(160deg,#1c1c21,#121215);border:2px solid #26262c;overflow:hidden}
.opt::after{content:"";position:absolute;right:-60px;bottom:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(224,30,38,.35),transparent 70%)}
.opt .n{font-family:var(--display);font-size:92px;line-height:1;color:var(--red)}
.opt svg{position:absolute;right:34px;top:34px;width:78px;height:78px}
.opt .l{position:absolute;left:34px;bottom:30px;font-weight:800;font-size:40px;letter-spacing:-.02em;line-height:1.05}
.opt .l small{display:block;font-weight:500;font-size:22px;color:#a9a9b0;margin-top:8px;letter-spacing:0}
.opt.hot{background:linear-gradient(160deg,var(--red),var(--red-deep));border-color:var(--red)}
.opt.hot .n{color:#fff}.opt.hot .l small{color:#ffd5d6}
.who{left:80px;right:80px;top:1540px;display:flex;align-items:center;gap:26px}
.av{width:118px;height:118px;border-radius:50%;background:url(fotos/joao-avatar.jpg) center/cover;box-shadow:0 0 0 5px var(--ink),0 0 0 10px var(--red);flex:none}
.who p{font-size:34px;line-height:1.25;font-weight:500;color:#e6e6e8}
.who p b{color:#fff;font-weight:800}
.arrow{left:0;right:0;top:1718px;text-align:center;font-weight:800;font-size:26px;letter-spacing:.24em;text-transform:uppercase;color:var(--red)}
.arrow svg{display:block;margin:10px auto 0;width:44px;height:44px}
</style></head><body>
<div class="canvas story grain">
  <div class="abs top"><div class="kicker" style="color:#fff;opacity:.75">Enquete rápida</div><div class="logo logo-white"></div></div>
  <div class="abs h display">Qual é a sua<br>próxima<span class="serif">conquista?</span></div>
  <div class="abs grid">
    <div class="opt hot"><div class="n">01</div>
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
      <div class="l">Casa própria<small>Sair do aluguel</small></div></div>
    <div class="opt"><div class="n">02</div>
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16h14v-3.5l-2-4.5H7l-2 4.5Z"/><path d="M5 12.5h14"/><circle cx="8" cy="16.5" r="1.8"/><circle cx="16" cy="16.5" r="1.8"/></svg>
      <div class="l">Carro novo<small>Ou trocar o atual</small></div></div>
    <div class="opt"><div class="n">03</div>
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M3 13h18"/></svg>
      <div class="l">Meu negócio<small>Sala, galpão, frota</small></div></div>
    <div class="opt"><div class="n">04</div>
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
      <div class="l">Investir<small>Construir patrimônio</small></div></div>
  </div>
  <div class="abs who"><div class="av"></div><p>Responda com o <b>número</b> e eu te mando uma <b>simulação sob medida</b>, sem compromisso.</p></div>
  <div class="abs arrow">Responda aqui
    <svg viewBox="0 0 24 24" fill="none" stroke="#E01E26" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg></div>
</div></body></html>
