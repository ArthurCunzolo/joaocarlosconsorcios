<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.canvas{background:var(--ink);color:#fff}
.half{left:0;right:0;top:0;height:960px;background:var(--off);color:var(--ink)}

.q{left:80px;right:80px;top:440px;font-family:var(--display);font-size:104px;line-height:1.1;text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:7px;text-transform:uppercase;color:#1c1c1f}

.qx{left:60px;right:60px;top:660px;height:14px;background:var(--red);transform:rotate(-6deg);border-radius:8px;opacity:.95}
.qx2{left:60px;right:60px;top:780px;height:14px;background:var(--red);transform:rotate(-6deg);border-radius:8px;opacity:.95}
.verd{left:80px;top:1040px}
.verd .label{background:#fff;color:var(--red)}

.a{left:80px;right:80px;top:1170px;font-size:52px;line-height:1.14;font-weight:800;letter-spacing:-.025em}

.a2{left:80px;width:500px;top:1430px;font-size:32px;line-height:1.35;font-weight:500;color:#ffe3e4}

.cta2 svg{width:36px;height:36px}
.logo{right:80px;top:240px;width:84px;height:76px}
.kick{left:80px;top:240px;color:var(--red)}
.vs{left:50%;top:960px;transform:translate(-50%,-50%);width:120px;height:120px;border-radius:50%;background:var(--ink);border:6px solid var(--off);display:grid;place-items:center;font-family:var(--display);font-size:46px;color:#fff}
.photo{right:-140px;bottom:0;height:560px;filter:drop-shadow(-20px 0 40px rgba(0,0,0,.35))}

<div class="canvas story grain">
